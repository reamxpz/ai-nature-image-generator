<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nature Image Generation Template</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Nature Image Generation Template</h1>
            <p class="subtitle">Select keywords, style, and generate your prompt</p>
        </header>

        <div class="form-section">

            <!-- KEYWORD Section -->
            <div class="section-card">
                <div class="section-header" onclick="toggleSection('keywordContent')">
                    <h2>1. Keywords</h2>
                    <span class="toggle-icon" id="keywordContent-icon">▼</span>
                </div>
                <div class="section-body open" id="keywordContent">

                    <!-- Quick Random from ALL -->
                    <div class="random-all-section">
                        <button class="action-btn random-all-btn" onclick="randomFromAll()">
                            <span class="btn-icon">🎲</span> Random Keyword (All Categories)
                        </button>
                    </div>

                    <!-- Category Selection -->
                    <label class="field-label">Or pick a category:</label>
                    <div class="category-buttons" id="categoryButtons"></div>

                    <!-- Keywords from category -->
                    <div id="keywordSection" style="display:none;">
                        <div class="keyword-actions">
                            <button class="action-btn random-btn" onclick="randomKeywords()">
                                <span class="btn-icon">🎲</span> Random from this category
                            </button>
                        </div>
                        <div class="keyword-chips" id="keywordChips"></div>
                    </div>

                    <!-- Custom keyword -->
                    <label class="field-label">Custom Keyword:</label>
                    <div class="custom-keyword-input">
                        <input type="text" id="customKeyword" placeholder="Type your own keyword and press Enter...">
                        <button class="action-btn add-custom-btn" onclick="addCustomKeyword()">+</button>
                    </div>
                    <div class="custom-keyword-tags" id="customKeywordTags"></div>

                    <!-- Selected display -->
                    <div class="selected-keywords">
                        <strong>Selected:</strong> <span id="selectedKeywords">None</span>
                    </div>
                </div>
            </div>

            <!-- STYLE + MOOD + PALETTE -->
            <div class="section-card">
                <div class="section-header" onclick="toggleSection('styleContent')">
                    <h2>2. Style & Mood</h2>
                    <span class="toggle-icon" id="styleContent-icon">▼</span>
                </div>
                <div class="section-body open" id="styleContent">
                    <label class="field-label">Image Style:</label>
                    <select id="styleSelect" class="select-input" onchange="selectedStyle = this.value"></select>

                    <label class="field-label">Mood:</label>
                    <select id="moodSelect" class="select-input" onchange="selectedMood = this.value"></select>

                    <label class="field-label">Color Palette:</label>
                    <select id="paletteSelect" class="select-input" onchange="selectedPalette = this.value"></select>
                </div>
            </div>

            <!-- NUMBER OF IMAGES -->
            <div class="section-card compact-row">
                <h2>3. Number of Images</h2>
                <div class="number-input">
                    <button class="num-btn" onclick="changeCount(-1)">-</button>
                    <input type="number" id="imageCount" value="15" min="1" max="50">
                    <button class="num-btn" onclick="changeCount(1)">+</button>
                </div>
            </div>

            <!-- Generate Button -->
            <button class="generate-btn" onclick="generateTemplate()">Generate Template</button>
        </div>

        <!-- Output Section -->
        <div class="output-section" id="outputSection" style="display:none;">
            <h2>Generated Template</h2>
            <div class="output-actions">
                <button class="copy-btn" onclick="copyTemplate()">Copy to Clipboard</button>
                <button class="reset-btn" onclick="resetAll()">🔄 Start Over</button>
            </div>
            <pre id="templateOutput"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
